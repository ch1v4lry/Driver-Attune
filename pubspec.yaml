name: driver_focus
description: A Flutter prototype for detecting driver distraction with camera and device signals.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  audioplayers: ^6.1.0
  camera: ^0.12.0+1
  flutter:
    sdk: flutter
  geolocator: ^13.0.0
  google_mlkit_face_detection: ^0.13.2
  image: ^4.2.0
  path_provider: ^2.1.0
  sensors_plus: ^7.1.0
  shared_preferences: ^2.2.0
  wakelock_plus: ^1.4.0

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/alarm.wav
